name: bankmanagement

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bankmanagement-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_MEMORY_LIMIT_MB: "${MSSQL_MEMORY_LIMIT_MB:-2048}"
    ports:
      # Host/WSL/SSMS uses 14331; containers use mssql:1433.
      - "127.0.0.1:${MSSQL_HOST_PORT:-14331}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -C
          -b
          -Q "SELECT 1"
          -o /dev/null
          || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bankmanagement-db-init
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/workspace/docker/init-db.sh"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_HOST: mssql
      MSSQL_PORT: "1433"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env.docker}"
      BANK_APP_PASSWORD: "${BANK_APP_PASSWORD:?Set BANK_APP_PASSWORD in .env.docker}"
      BANK_REPORT_PASSWORD: "${BANK_REPORT_PASSWORD:?Set BANK_REPORT_PASSWORD in .env.docker}"
      BANK_AUDITOR_PASSWORD: "${BANK_AUDITOR_PASSWORD:?Set BANK_AUDITOR_PASSWORD in .env.docker}"
      BANK_HIGHADMIN_REPORT_PASSWORD: "${BANK_HIGHADMIN_REPORT_PASSWORD:?Set BANK_HIGHADMIN_REPORT_PASSWORD in .env.docker}"
      BANK_MAINTENANCE_PASSWORD: "${BANK_MAINTENANCE_PASSWORD:?Set BANK_MAINTENANCE_PASSWORD in .env.docker}"
      LOAD_SAMPLE_DATA: "${LOAD_SAMPLE_DATA:-false}"
      INSTALL_AGENT_JOBS: "${INSTALL_AGENT_JOBS:-true}"
      FORCE_DB_REBUILD: "${FORCE_DB_REBUILD:-false}"
    volumes:
      - .:/workspace:ro
    depends_on:
      mssql:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankmanagement-backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      SESSION_TTL_MINUTES: "${SESSION_TTL_MINUTES:-10}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5500,http://127.0.0.1:5500}"

      # IMPORTANT: service-to-service traffic uses the SQL Server container port.
      DB_SERVER: mssql
      DB_PORT: "1433"
      DB_DATABASE: BankManagement
      DB_USER: BankAppLogin
      DB_PASSWORD: "${BANK_APP_PASSWORD:?Set BANK_APP_PASSWORD in .env.docker}"
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      DB_REQUEST_TIMEOUT_MS: "30000"
      DB_CONNECTION_TIMEOUT_MS: "15000"
      DB_POOL_MAX: "10"
      DB_POOL_MIN: "0"
      DB_USE_UTC: "false"

      REPORT_DB_USER: BankReportLogin
      REPORT_DB_PASSWORD: "${BANK_REPORT_PASSWORD:?Set BANK_REPORT_PASSWORD in .env.docker}"
      AUDIT_DB_USER: BankAuditorLogin
      AUDIT_DB_PASSWORD: "${BANK_AUDITOR_PASSWORD:?Set BANK_AUDITOR_PASSWORD in .env.docker}"
      HIGHADMIN_REPORT_DB_USER: BankHighAdminReportLogin
      HIGHADMIN_REPORT_DB_PASSWORD: "${BANK_HIGHADMIN_REPORT_PASSWORD:?Set BANK_HIGHADMIN_REPORT_PASSWORD in .env.docker}"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-4000}:4000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  frontend:
    build:
      context: ./BankManagement_Frontend_Complete/BankManagement_Frontend_Complete
      dockerfile: Dockerfile
    container_name: bankmanagement-frontend
    environment:
      FRONTEND_HOST: 0.0.0.0
      FRONTEND_PORT: "5500"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5500}:5500"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  mssql-data:
