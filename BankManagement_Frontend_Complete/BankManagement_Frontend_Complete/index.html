<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="BankManagement secure role-based banking application">
  <title>BankManagement · Sign in</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-visual" aria-label="BankManagement introduction">
      <a class="brand" href="index.html">
        <span class="brand-mark" id="hero-brand-icon"></span>
        <span class="brand-copy"><strong>BankManagement</strong><small>Secure banking suite</small></span>
      </a>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <a class="brand auth-mobile-brand" href="index.html">
          <span class="brand-mark" id="mobile-brand-icon"></span>
          <span class="brand-copy"><strong>BankManagement</strong><small>Secure banking suite</small></span>
        </a>
        <h2 id="auth-title">Welcome back</h2>
        <p id="auth-copy">Sign in to the workspace assigned to your effective role.</p>

        <div class="alert alert-info hidden" id="existing-session">
          An active session is already stored in this browser.
          <button class="btn btn-sm btn-secondary" style="margin-left:.5rem" type="button">Continue</button>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
          <button class="active" type="button" data-auth-tab="login">Sign in</button>
          <button type="button" data-auth-tab="signup">Customer signup</button>
        </div>

        <div id="auth-message" class="auth-message" role="status"></div>

        <form id="login-form" class="auth-form" autocomplete="on">
          <div class="field"><label for="login-username">Username</label><input class="input" id="login-username" name="username" autocomplete="username" required placeholder="Enter your username"></div>
          <div class="field"><label for="login-password">Password</label><div class="password-wrap"><input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password"><button class="password-toggle" type="button" data-password-toggle="login-password" aria-label="Show password"></button></div></div>
          <div class="auth-row"><label class="checkbox"><input type="checkbox" name="remember" checked> Keep this session on this device</label><span class="muted">Secure database session</span></div>
          <button class="btn btn-primary" type="submit">Sign in securely</button>
        </form>

        <form id="signup-form" class="auth-form hidden" autocomplete="on">
          <div class="form-grid">
            <div class="field"><label>First name *</label><input class="input" name="firstName" required></div>
            <div class="field"><label>Last name *</label><input class="input" name="lastName" required></div>
            <div class="field"><label>National ID *</label><input class="input" name="nationalID" required></div>
            <div class="field"><label>Birth date *</label><input class="input" type="date" name="birthDate" required></div>
            <div class="field"><label>Phone *</label><input class="input" name="phone" required></div>
            <div class="field"><label>Email *</label><input class="input" type="email" name="email" required></div>
            <div class="field"><label>Username *</label><input class="input" name="username" autocomplete="username" required></div>
            <div class="field"><label>Password *</label><div class="password-wrap"><input class="input" id="signup-password" type="password" name="password" autocomplete="new-password" required><button class="password-toggle" type="button" data-password-toggle="signup-password" aria-label="Show password"></button></div></div>
            <div class="field full"><label>Address</label><textarea class="textarea" name="address"></textarea></div>
          </div>
          <button class="btn btn-primary" type="submit">Create customer access</button>
        </form>

        <div class="auth-connection"><span>Backend: <strong id="auth-api-url"></strong></span><button class="btn btn-sm btn-secondary" id="auth-api-settings" type="button">Connection settings</button></div>
        <div class="auth-secondary-actions"><button class="preview-link button-link" id="initial-highadmin-setup" type="button">First-time HighAdmin setup</button><a class="preview-link" href="preview.html">Preview all role interfaces without signing in →</a></div>
      </div>
    </section>
  </main>

  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/core/icons.js"></script>
  <script src="assets/js/core/session.js"></script>
  <script src="assets/js/core/mock-data.js"></script>
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/pages/auth-page.js"></script>
  <script>
    document.getElementById('hero-brand-icon').innerHTML = BankIcons.icon('bank',24);
    document.getElementById('mobile-brand-icon').innerHTML = BankIcons.icon('bank',24);
    document.querySelectorAll('[data-password-toggle]').forEach(b => { if (!b.innerHTML) b.innerHTML = BankIcons.icon('eye',18); });
  </script>
</body>
</html>
